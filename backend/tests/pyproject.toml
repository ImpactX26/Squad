[project]
name = "servicemesh-backend"
version = "0.1.0"
description = "ServiceMesh backend: FastAPI API, AI brain, channel adapters, MCP servers"
requires-python = "==3.12.*"
dependencies = [
    "aiosmtplib==5.1.3",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "discord-py==2.7.1",
    "email-reply-parser==0.5.12",
    "fastapi==0.142.2",
    "fastembed==0.8.1",
    "httpx==0.28.1",
    "imap-tools==1.15.0",
    "jinja2==3.1.6",
    "mcp==2.2.0",
    "openai==3.22.1",
    "pgvector==0.5.0",
    "pydantic-settings==2.15.0",
    "pydantic[email]==2.13.5",
    "pyjwt==2.15.1",
    "python-telegram-bot==22.8",
    "reportlab==5.0.1",
    "sqlalchemy[asyncio]==2.1.1",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "pypdf==6.19.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]